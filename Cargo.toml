[package]
name = "seindtask"
version = "0.2.0"
edition = "2024"
description = "Odak: gÃ¶rev yÃ¶neticisi"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6" }
auto-launch = "0.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simplelog = "0.12"
tray-icon = "0.25"
unicode-segmentation = "1"
ureq = { version = "3.4", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
velopack = "1.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[build-dependencies]
winresource = "0.1"
