[package]
name = "seindtask"
version = "0.4.0"
edition = "2024"
description = "Odak: gÃ¶rev yÃ¶neticisi"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6" }
auto-launch = "0.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simplelog = "0.12"
# Default features only pick the GTK/AppIndicator backend on Linux; Linux enables KSNI below.
tray-icon = { version = "0.25", default-features = false }
unicode-segmentation = "1"
ureq = { version = "3.4", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
velopack = "1.2"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# gpui-pre-platform builds no Linux backend by default; without these it panics at startup.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["wayland", "x11"] }
# StatusNotifierItem over D-Bus (native on KDE): runs its own thread, no GTK or libxdo needed.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# The refresh token goes to the desktop's Secret Service (KWallet, GNOME Keyring) instead of DPAPI.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
winresource = "0.1"
